[project]
name = "tax-harness"
version = "0.1.0"
description = "Traceable financial task assistant for the competition simulation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]
knowledge = [
  "torch==2.8.0",
  "setuptools==80.9.0",
  "pypdf==6.21.4",
  "jieba==0.42.1",
  "numpy==2.2.6",
  "transformers==4.57.6",
  "huggingface-hub>=0.34,<1",
  "zstandard==0.25.0",
]

[project.scripts]
tax-harness = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

